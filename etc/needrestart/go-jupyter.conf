# go-jupyter: each curator's JupyterLab server is a transient systemd unit
# (jupyterhub-systemdspawner). "Restarting" a transient unit only stops it,
# and every Claude Code session running inside it ends with it. On
# 2026-11-06 needrestart did that to all 11 servers after an apt security
# upgrade. Housekeeping on this box is the reset rule (GO_JUPYTER_RESET_DAYS,
# see the go-jupyter README); needrestart leaves these units alone.
$nrconf{override_rc}->{qr(^jupyter-.+-singleuser)} = 0;
